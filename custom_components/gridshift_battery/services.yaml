apply_configuration:
  name: Apply GridShift configuration
  description: >-
    Validates and stores an entity mapping submitted by the GridShift application.
    Existing control choices are preserved for unchanged actuator targets.
    New actuator targets remain disabled until explicitly enabled.
  fields:
    configuration:
      name: Configuration
      description: Validated GridShift entity mapping and safety limits.
      required: true
      example:
        price_entity: sensor.electricity_price
        soc_entity: sensor.battery_state_of_charge
        house_load_entity: sensor.house_power
        phase_current_entities:
          - sensor.current_l1
          - sensor.current_l2
          - sensor.current_l3
        control_mode_entity: select.storage_control_mode
        charge_power_entity: number.grid_charge_power
      selector:
        object:

force_action:
  name: Force battery action
  description: >-
    Overrides the price plan for a short period. Live phase freshness, fuse
    headroom, state-of-charge limits, and the discharge opt-in still apply.
  fields:
    action:
      name: Action
      required: true
      selector:
        select:
          options:
            - charge
            - discharge
            - idle
    duration_minutes:
      name: Duration
      description: Minutes before the automatic plan resumes.
      required: true
      selector:
        number:
          min: 1
          max: 15
          step: 1
          unit_of_measurement: min

clear_force_action:
  name: Return to automatic plan
  description: Clears the active manual battery action and refreshes the optimizer.

set_plan_overrides:
  name: Set quarter-hour plan overrides
  description: >-
    Replaces the persisted charge or idle overrides selected in the GridShift
    price-plan graph. Overrides are keyed by ISO 8601 quarter start time.
  fields:
    overrides:
      name: Overrides
      description: Mapping from ISO 8601 quarter start to charge or idle.
      required: true
      example:
        "2026-11-07T12:30:00+00:00": charge
      selector:
        object:

set_notifications:
  name: Configure anomaly notifications
  description: >-
    Saves opt-in notification recipients and events without changing battery or
    thermostat control. Recipients are explicit mobile-app actions or notify entities.
  fields:
    settings:
      name: Notification settings
      required: true
      example:
        enabled: true
        targets:
          - notify.mobile_app_your_phone
        events:
          - control_error
          - missing_data
          - reserve_shortfall
        recovery: true
        language: sv
      selector:
        object:

test_notifications:
  name: Send a test notification
  description: >-
    Sends a test only to saved notification recipients, even when automatic
    notifications are disabled. Limited to one test per minute.


